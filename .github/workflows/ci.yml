name: ci
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.13.1" }
      # Lint before the slower steps; the rule set is pinned in pyproject.toml.
      - run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: packages/ui/frontend/.nvmrc, cache: npm, cache-dependency-path: packages/ui/frontend/package-lock.json }
      - run: npm ci && npm run build
        working-directory: packages/ui/frontend
      # The pinned restic (scripts/fetch_restic.py checks its SHA-256), so the backup and
      # restore-test tests run. With RECORDINGS_REQUIRE_RESTIC=1 they fail, never skip, without it.
      - run: uv run --frozen python scripts/fetch_restic.py
      - run: uv run --frozen pytest
        env: { RECORDINGS_REQUIRE_RESTIC: "1" }
      - run: uv run --frozen recordings schemas --check
      - run: uv run --frozen recordings validate demo/archive --deep

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults: { run: { working-directory: packages/ui/frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: packages/ui/frontend/.nvmrc, cache: npm, cache-dependency-path: packages/ui/frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      # Build first: build.test.ts checks the built www/ui.js, and CI=true makes a missing one fail.
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.13.1" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: packages/ui/frontend/.nvmrc, cache: npm, cache-dependency-path: packages/ui/frontend/package-lock.json }
      - run: npm ci && npm run build
        working-directory: packages/ui/frontend
      - run: uv run --frozen playwright install --with-deps chromium
      # The venv now holds shinyreact.js, so the built bundle's React major.minor check runs here
      # (the frontend job has no venv). A skip is a failure with this set.
      - run: npx vitest run src/build.test.ts
        working-directory: packages/ui/frontend
        env: { RECORDINGS_REQUIRE_SHINYREACT: "1" }
      - run: uv run --frozen pytest -m e2e --basetemp=e2e-tmp
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-server-logs
          path: e2e-tmp/**/server.log
          if-no-files-found: ignore
          retention-days: 7

  leaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: download gitleaks
        run: curl -fsSL --retry 3 --max-time 120 -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
      - name: check gitleaks against its pinned checksum, then unpack it
        run: |
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: gitleaks over the whole history
        run: ./gitleaks git --redact --no-banner -v .

  docker:
    # amd64 for the homelab server, arm64 so the image runs on the Mac too, each on a native runner:
    # libsass compiles from C++ source on arm64, which under QEMU could outlast the timeout.
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux/amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built, never pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false

  compose-smoke:
    # The real compose file, once, as the runner's own user, against temporary folders (stage-1
    # carry-over): every bind must exist, init must work in the image, ssh must find the user,
    # restic and rsync must run in the backup service, and /healthz must answer.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.13.1" }
      - run: uv run --frozen python scripts/compose_smoke.py
