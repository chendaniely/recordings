# Update proposals, a few at a time, on Fridays. Actions stay SHA-pinned: Dependabot moves a
# SHA pin and its version comment together.
# A shinyreact PR (Python `shinyreact` or npm `@posit-dev/shinyreact`) is the upgrade signal
# (spec §13). Never merge one alone: follow CLAUDE.md "Upgrading shinyreact", which bumps both
# pins together. The toolchain majors that must match shinyreact's examples are ignored here and
# upgraded by hand, as part of that.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: friday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "ci" }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: friday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "build" }
  - package-ecosystem: npm
    directory: /packages/ui/frontend
    schedule: { interval: weekly, day: friday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "build(ui)" }
    ignore:
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly, day: friday }
    open-pull-requests-limit: 2
    commit-message: { prefix: "build(docker)" }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
