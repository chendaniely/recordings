# uv workspace: the core library/CLI and the UI app (spec §4). The root is not a package.
[project]
name = "recordings-workspace"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["recordings", "recordings-ui"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/ui"]

[tool.uv.sources]
recordings = { workspace = true }
recordings-ui = { workspace = true }

# A dependency group, not an extra, so a plain `uv sync` can never silently remove pytest
# (the audio-router lesson).
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-playwright==0.10.0",
    "httpx2==2.13.1",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
]
# The static GitHub Pages demo (spec §17.1): `make pages`, run with `uv run --group pages`.
# Pinned exactly: scripts/shinylive_local.py patches one of its private functions, and the
# version fixes the Shinylive assets it downloads (0.8.12 uses assets 0.10.15, with Pyodide
# 0.27.7, Python 3.12 and shiny 1.8.0). A bump changes what the browser runs, so a bump PR
# must pass the Pages smoke test (pages.yml runs it on pull requests).
pages = ["shinylive==0.8.12"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/ui/tests"]
# importlib mode: both packages have a tests/ folder with same-named files.
addopts = "--import-mode=importlib -m 'not e2e and not pages'"
markers = [
    "e2e: browser tests against a running demo server (need the built frontend)",
    "pages: browser tests against the static Pages demo in _site/ (need `make pages`)",
]

[tool.ruff]
line-length = 100
# The server runs 3.14, but the Pages demo vendors recordings and recordings_ui into Pyodide,
# whose Python is 3.12 (Pyodide 0.27.7, in Shinylive's 0.10.15 assets). So ruff writes no newer
# syntax (like 3.14's unparenthesised `except A, B:`), and flags any that is added. This
# overrides requires-python, for ruff only. CLAUDE.md "Upgrading Shinylive" keeps it in step.
target-version = "py312"

[tool.ruff.lint]
# An explicit rule set (ruff's docs: prefer lint.select), so a ruff upgrade can't change what is
# checked: 0.17.0 dropped the datetimez rules from its defaults, and dates are this app's core.
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "PERF", "BLE", "PLW", "FURB", "RUF",
    "ISC004",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # deliberate typographic dashes; test_ids.py's lookalike digits
    "PLW0603",  # module state behind functions (ops.py, runtime.py) is deliberate
]
