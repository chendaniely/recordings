[project]
name = "recordings"
version = "0.1.0"
description = "Core library and CLI for the recordings archive."
requires-python = ">=3.14"
license = "MIT"
dependencies = ["pydantic==2.13.5"]

[project.scripts]
recordings = "recordings.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recordings"]
include = ["src/recordings/format/**/*.md", "src/recordings/format/schemas/**/*.json"]
